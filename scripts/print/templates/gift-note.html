<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gift note</title>
<style>
  /*
   * Fetch the same flowing script font the live web preview uses on the
   * front-cover caption. Playwright (the renderer) downloads it once
   * per render run. Cursive fallbacks chain to system fonts so the print
   * still renders something legible if the host is offline at render
   * time — Apple Chancery on macOS, the generic 'cursive' family on
   * Linux/Windows.
   */
  @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');
  @page { size: 297mm 210mm; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; color: #2c1810;
    font-family: Georgia, "Times New Roman", serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .sheet {
    position: relative;
    width: 297mm;
    height: 210mm;
    padding: 3mm;
    page-break-after: always;
  }
  .sheet:last-child { page-break-after: auto; }

  .crop { position: absolute; background: #000; }
  .crop.tl-h { top: 0; left: 0; width: 3mm; height: 0.3mm; }
  .crop.tl-v { top: 0; left: 0; width: 0.3mm; height: 3mm; }
  .crop.tr-h { top: 0; right: 0; width: 3mm; height: 0.3mm; }
  .crop.tr-v { top: 0; right: 0; width: 0.3mm; height: 3mm; }
  .crop.bl-h { bottom: 0; left: 0; width: 3mm; height: 0.3mm; }
  .crop.bl-v { bottom: 0; left: 0; width: 0.3mm; height: 3mm; }
  .crop.br-h { bottom: 0; right: 0; width: 3mm; height: 0.3mm; }
  .crop.br-v { bottom: 0; right: 0; width: 0.3mm; height: 3mm; }
  .fold {
    position: absolute;
    top: 3mm; bottom: 3mm;
    left: 50%;
    width: 0;
    border-left: 0.2mm dashed rgba(0,0,0,0.35);
    pointer-events: none;
  }

  .spread {
    position: relative;
    width: 291mm;
    height: 204mm;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .page {
    padding: 14mm 14mm 18mm 14mm;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .page-back { background: linear-gradient(180deg, #fff 0%, #fbf6ef 100%); }
  .page-front {
    background: linear-gradient(180deg, #fff 0%, #fbf6ef 100%);
    display: flex; flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 18mm 16mm;
  }
  .page-inside-left {
    background: #fff;
  }
  .page-inside-right {
    background: linear-gradient(180deg, #fff 0%, #fbf6ef 100%);
    justify-content: space-between;
  }

  .front-art {
    width: 100%;
    max-height: 130mm;
    object-fit: contain;
  }
  .front-caption {
    /*
     * Match the live web preview's front-caption styling (guests.css
     * `.gift-note-card__front-caption`): a flowing script font, larger
     * than body copy, dark-brown rather than purple. The web preview
     * uses clamp(1.8rem, 3.4vw, 2.8rem) ≈ 28-45 px; at A4 landscape
     * print size, 28pt sits in the same visual weight band.
     */
    font-family: 'Great Vibes', 'Allura', 'Pinyon Script', 'Apple Chancery', cursive;
    font-style: normal;
    text-align: center;
    color: #4b3127;
    font-size: 28pt;
    line-height: 1.1;
    letter-spacing: 0.01em;
    margin-top: 6mm;
  }
  .back-text {
    margin: auto;
    text-align: center;
    color: #8a7a6f;
    font-size: 10pt;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .type-title {
    margin: 0 0 6mm;
    font-size: 11pt;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #8b5a96;
    font-weight: 700;
  }
  .gift-block {
    background: rgba(139, 90, 150, 0.08);
    border: 0.3mm solid rgba(139, 90, 150, 0.18);
    padding: 6mm 7mm;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6mm;
    align-items: start;
  }
  .gift-title { margin: 0 0 2mm; font-size: 13pt; line-height: 1.35; font-weight: 700; }
  .gift-description { margin: 0; font-size: 10.5pt; line-height: 1.55; color: #4a382e; }
  .gift-amount {
    align-self: start;
    padding: 2mm 4mm;
    border: 0.3mm solid rgba(139, 90, 150, 0.32);
    background: #fff;
    font-weight: 700;
    font-size: 11pt;
    white-space: nowrap;
  }
  .wish {
    margin-top: 6mm;
    font-size: 10pt;
    line-height: 1.55;
    color: #6f4f7c;
    font-style: italic;
  }
  /*
   * The `:not([hidden])` qualifier is REQUIRED. The element starts with the
   * HTML `hidden` attribute set (and the inline JS only clears it for cash
   * gifts). A plain `display: flex` rule would override the user-agent's
   * implicit `[hidden] { display: none }` and make this element visible for
   * cube/figurine gifts too — that bug rendered an empty grey insert below
   * the gift summary on every non-cash printed gift note.
   */
  .honeymoon-attached:not([hidden]) {
    margin-top: 8mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2mm;
  }
  .honeymoon-attached-label {
    font-size: 8pt;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #8a8782;
  }
  .honeymoon-card-stub {
    position: relative;
    width: 78mm;
    aspect-ratio: 1.586 / 1;
    background-size: cover;
    background-position: center;
    box-shadow: 0 2mm 5mm rgba(44, 24, 16, 0.16);
    transform: rotate(-2deg);
    overflow: hidden;
  }
  .honeymoon-card-stub::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.55) 100%);
  }
  .honeymoon-card-stub-title {
    position: absolute;
    left: 4mm; right: 4mm; bottom: 3mm;
    z-index: 1;
    color: #fff;
    font-size: 9pt;
    line-height: 1.2;
    font-weight: 700;
  }

  .message {
    font-size: 11pt;
    line-height: 1.6;
    white-space: pre-line;
    padding: 4mm 0 6mm;
    border-bottom: 0.2mm solid rgba(44, 24, 16, 0.1);
    min-height: 22mm;
    color: #2c1810;
  }
  .message.empty { color: #b0a59b; font-style: italic; }
  .handwriting-area {
    flex: 1;
    min-height: 50mm;
    margin-top: 4mm;
    background-image: repeating-linear-gradient(
      transparent, transparent 9mm, rgba(44, 24, 16, 0.08) 9mm, rgba(44, 24, 16, 0.08) 9.2mm
    );
  }
  .signoff {
    margin-top: 6mm;
    display: flex;
    flex-direction: column;
    gap: 2mm;
  }
  .signer {
    font-size: 12pt;
    font-weight: 700;
  }
  .signature-space {
    margin-top: 6mm;
    height: 18mm;
    border-bottom: 0.3mm solid rgba(44, 24, 16, 0.25);
  }
</style>
</head>
<body>
  <section class="sheet" aria-label="Outside spread">
    <span class="crop tl-h"></span><span class="crop tl-v"></span>
    <span class="crop tr-h"></span><span class="crop tr-v"></span>
    <span class="crop bl-h"></span><span class="crop bl-v"></span>
    <span class="crop br-h"></span><span class="crop br-v"></span>
    <div class="fold"></div>
    <div class="spread">
      <div class="page page-back">
        <div class="back-text" id="back-text"></div>
      </div>
      <div class="page page-front">
        <img id="front-art" class="front-art" alt="">
        <div class="front-caption" id="front-caption"></div>
      </div>
    </div>
  </section>

  <section class="sheet" aria-label="Inside spread">
    <span class="crop tl-h"></span><span class="crop tl-v"></span>
    <span class="crop tr-h"></span><span class="crop tr-v"></span>
    <span class="crop bl-h"></span><span class="crop bl-v"></span>
    <span class="crop br-h"></span><span class="crop br-v"></span>
    <div class="fold"></div>
    <div class="spread">
      <div class="page page-inside-left">
        <div class="type-title" id="type-title">Gift</div>
        <div class="gift-block">
          <div>
            <h2 class="gift-title" id="gift-title"></h2>
            <p class="gift-description" id="gift-description"></p>
          </div>
          <div class="gift-amount" id="gift-amount"></div>
        </div>
        <div class="wish" id="wish"></div>
        <div class="honeymoon-attached" id="honeymoon-attached" hidden>
          <div class="honeymoon-attached-label" id="honeymoon-attached-label"></div>
          <div class="honeymoon-card-stub" id="honeymoon-card-stub">
            <div class="honeymoon-card-stub-title" id="honeymoon-card-stub-title"></div>
          </div>
        </div>
      </div>
      <div class="page page-inside-right">
        <div>
          <div class="type-title" id="couple-names"></div>
          <div class="message" id="message"></div>
          <div class="handwriting-area"></div>
        </div>
        <div class="signoff">
          <div class="signer"><span aria-hidden="true">— </span><span id="signer"></span></div>
          <div class="signature-space"></div>
        </div>
      </div>
    </div>
  </section>

  <!--INJECT-DATA-->
  <script>
    /*
     * Per-language chrome strings for the printed gift note. Sourced from
     * public/js/i18n.js where equivalents exist; new strings added here are
     * marked with a comment so they can be back-ported into i18n.js if any
     * live UI ever needs them. Keep all four languages in sync — every key
     * should have an en/es/fr/de entry.
     */
    var STRINGS = {
      en: {
        backText: 'A wedding gift for you',
        frontCaption: 'A wedding gift for you \u2026',
        typeLabel: { cash: 'Honeymoon card', cube: 'Block #{n} for our wedding sculpture', figurine: 'Figurine', fallback: 'Gift' },
        wish: 'We hope our contribution to your honeymoon fund helps make your voyage truly memorable.',
        attachedLabel: 'Honeymoon card attached',
        emptyMessage: '(Add a handwritten message on the day if you wish.)',
      },
      es: {
        backText: 'Un regalo de boda para vosotros',
        frontCaption: 'Un regalo de boda para vosotros \u2026',
        typeLabel: { cash: 'Tarjeta de luna de miel', cube: 'Bloque #{n} para nuestra escultura de boda', figurine: 'Figurita', fallback: 'Regalo' },
        wish: 'Esperamos que nuestra contribuci\u00f3n a vuestro fondo de luna de miel haga que vuestro viaje sea inolvidable.',
        attachedLabel: 'Tarjeta de luna de miel adjunta',
        emptyMessage: '(A\u00f1ade un mensaje a mano el d\u00eda de la boda si quieres.)',
      },
      fr: {
        backText: 'Un cadeau de mariage pour vous',
        frontCaption: 'Un cadeau de mariage pour vous \u2026',
        typeLabel: { cash: 'Carte lune de miel', cube: 'Bloc #{n} pour notre sculpture de mariage', figurine: 'Figurine', fallback: 'Cadeau' },
        wish: 'Nous esp\u00e9rons que notre contribution \u00e0 votre cagnotte lune de miel rendra votre voyage vraiment inoubliable.',
        attachedLabel: 'Carte lune de miel fix\u00e9e',
        emptyMessage: '(Ajoutez un mot \u00e0 la main le jour du mariage si vous le souhaitez.)',
      },
      de: {
        backText: 'Ein Hochzeitsgeschenk f\u00fcr euch',
        frontCaption: 'Ein Hochzeitsgeschenk f\u00fcr euch \u2026',
        typeLabel: { cash: 'Hochzeitsreise-Karte', cube: 'Block #{n} f\u00fcr unsere Hochzeitsskulptur', figurine: 'Figur', fallback: 'Geschenk' },
        wish: 'Wir hoffen, dass unser Beitrag zu eurer Hochzeitsreise-Kasse eure Reise wirklich unvergesslich macht.',
        attachedLabel: 'Hochzeitsreise-Karte beigeheftet',
        emptyMessage: '(F\u00fcgt am Hochzeitstag gerne eine handgeschriebene Nachricht hinzu.)',
      },
    };

    function pickLang(d) {
      var raw = d && d.purchase && d.purchase.lang;
      var lang = (typeof raw === 'string' ? raw : 'en').toLowerCase();
      return STRINGS[lang] ? lang : 'en';
    }

    /*
     * Mirrors server/utils/localized.js `localize()`: pick the requested
     * language, fall back to English, then to any non-empty value. Used for
     * the per-gift title/description (which the server stores as a
     * 4-language dict).
     */
    function localize(obj, lang) {
      if (!obj || typeof obj !== 'object') return '';
      var direct = obj[lang];
      if (direct && String(direct).trim() !== '') return direct;
      if (lang !== 'en' && obj.en && String(obj.en).trim() !== '') return obj.en;
      for (var k in obj) {
        if (Object.prototype.hasOwnProperty.call(obj, k) && obj[k] && String(obj[k]).trim() !== '') return obj[k];
      }
      return '';
    }

    (function () {
      var d = window.__DESCRIPTOR__;
      if (!d) { window.__TEMPLATE_READY__ = true; return; }
      var lang = pickLang(d);
      var S = STRINGS[lang];

      // Localised front + back cover.
      document.getElementById('back-text').textContent = S.backText;
      document.getElementById('front-caption').textContent = S.frontCaption;

      var coverUri = d.artefacts && d.artefacts.giftNote && d.artefacts.giftNote.coverImageDataUri;
      var artImg = document.getElementById('front-art');
      if (coverUri) artImg.src = coverUri;
      else artImg.style.visibility = 'hidden';

      // Per-buyer-language gift title + description. Falls back to en, then
      // any non-empty, so missing translations don't blank out the card.
      var title = localize(d.gift && d.gift.title, lang);
      var desc = localize(d.gift && d.gift.description, lang);
      document.getElementById('gift-title').textContent = title;
      document.getElementById('gift-description').textContent = desc;

      var amountEl = document.getElementById('gift-amount');
      if (typeof d.purchase.amount === 'number' && d.purchase.amount > 0) {
        amountEl.textContent = '\u20ac' + d.purchase.amount;
      } else {
        amountEl.hidden = true;
      }

      // Gift-type label on the left inside page. The cube label has a
      // {n} placeholder for the block number.
      var t = d.gift && d.gift.type;
      var label = S.typeLabel.fallback;
      if (t === 'cash') label = S.typeLabel.cash;
      else if (t === 'cube') label = S.typeLabel.cube.replace('{n}', String(d.gift.cubeId));
      else if (t === 'figurine') label = S.typeLabel.figurine;
      document.getElementById('type-title').textContent = label;

      document.getElementById('wish').textContent = S.wish;
      document.getElementById('honeymoon-attached-label').textContent = S.attachedLabel;

      var msgEl = document.getElementById('message');
      // messageDisplay is the buyer's message with any leading "Iluminada
      // y/and George, " salutation stripped by the CLI to avoid duplicating
      // the new couple-name heading above it. Fall back to the raw message
      // if the descriptor wasn't pre-processed (e.g. opened standalone).
      var msgText = (typeof d.purchase.messageDisplay === 'string' ? d.purchase.messageDisplay : d.purchase.message) || '';
      if (msgText.trim()) {
        msgEl.textContent = msgText;
      } else {
        msgEl.textContent = S.emptyMessage;
        msgEl.classList.add('empty');
      }

      document.getElementById('signer').textContent = d.purchase.signerName || d.guest.name || '';
      document.getElementById('couple-names').textContent = (d.couple && d.couple.names) || 'Iluminada & George';

      if (d.gift.type === 'cash' && d.artefacts.honeymoonCard && d.artefacts.honeymoonCard.imageDataUri) {
        var wrap = document.getElementById('honeymoon-attached');
        wrap.hidden = false;
        var stub = document.getElementById('honeymoon-card-stub');
        stub.style.backgroundImage = 'url("' + d.artefacts.honeymoonCard.imageDataUri + '")';
        document.getElementById('honeymoon-card-stub-title').textContent = title;
      }

      window.__TEMPLATE_READY__ = true;
    })();
  </script>
</body>
</html>
