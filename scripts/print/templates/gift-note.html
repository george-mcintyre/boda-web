<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gift note</title>
<style>
  @page { size: 297mm 210mm; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; color: #2c1810;
    font-family: Georgia, "Times New Roman", serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .sheet {
    position: relative;
    width: 297mm;
    height: 210mm;
    padding: 3mm;
    page-break-after: always;
  }
  .sheet:last-child { page-break-after: auto; }

  .crop { position: absolute; background: #000; }
  .crop.tl-h { top: 0; left: 0; width: 3mm; height: 0.3mm; }
  .crop.tl-v { top: 0; left: 0; width: 0.3mm; height: 3mm; }
  .crop.tr-h { top: 0; right: 0; width: 3mm; height: 0.3mm; }
  .crop.tr-v { top: 0; right: 0; width: 0.3mm; height: 3mm; }
  .crop.bl-h { bottom: 0; left: 0; width: 3mm; height: 0.3mm; }
  .crop.bl-v { bottom: 0; left: 0; width: 0.3mm; height: 3mm; }
  .crop.br-h { bottom: 0; right: 0; width: 3mm; height: 0.3mm; }
  .crop.br-v { bottom: 0; right: 0; width: 0.3mm; height: 3mm; }
  .fold {
    position: absolute;
    top: 3mm; bottom: 3mm;
    left: 50%;
    width: 0;
    border-left: 0.2mm dashed rgba(0,0,0,0.35);
    pointer-events: none;
  }

  .spread {
    position: relative;
    width: 291mm;
    height: 204mm;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .page {
    padding: 14mm 14mm 18mm 14mm;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .page-back { background: linear-gradient(180deg, #fff 0%, #fbf6ef 100%); }
  .page-front {
    background: linear-gradient(180deg, #fff 0%, #fbf6ef 100%);
    display: flex; flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 18mm 16mm;
  }
  .page-inside-left {
    background: #fff;
  }
  .page-inside-right {
    background: linear-gradient(180deg, #fff 0%, #fbf6ef 100%);
    justify-content: space-between;
  }

  .front-art {
    width: 100%;
    max-height: 130mm;
    object-fit: contain;
  }
  .front-caption {
    font-style: italic;
    text-align: center;
    color: #6f4f7c;
    font-size: 11pt;
    line-height: 1.5;
    margin-top: 6mm;
  }
  .back-text {
    margin: auto;
    text-align: center;
    color: #8a7a6f;
    font-size: 10pt;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .type-title {
    margin: 0 0 6mm;
    font-size: 11pt;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #8b5a96;
    font-weight: 700;
  }
  .gift-block {
    background: rgba(139, 90, 150, 0.08);
    border: 0.3mm solid rgba(139, 90, 150, 0.18);
    padding: 6mm 7mm;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6mm;
    align-items: start;
  }
  .gift-title { margin: 0 0 2mm; font-size: 13pt; line-height: 1.35; font-weight: 700; }
  .gift-description { margin: 0; font-size: 10.5pt; line-height: 1.55; color: #4a382e; }
  .gift-amount {
    align-self: start;
    padding: 2mm 4mm;
    border: 0.3mm solid rgba(139, 90, 150, 0.32);
    background: #fff;
    font-weight: 700;
    font-size: 11pt;
    white-space: nowrap;
  }
  .wish {
    margin-top: 6mm;
    font-size: 10pt;
    line-height: 1.55;
    color: #6f4f7c;
    font-style: italic;
  }
  .honeymoon-attached {
    margin-top: 8mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2mm;
  }
  .honeymoon-attached-label {
    font-size: 8pt;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #8a8782;
  }
  .honeymoon-card-stub {
    position: relative;
    width: 78mm;
    aspect-ratio: 1.586 / 1;
    background-size: cover;
    background-position: center;
    box-shadow: 0 2mm 5mm rgba(44, 24, 16, 0.16);
    transform: rotate(-2deg);
    overflow: hidden;
  }
  .honeymoon-card-stub::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.55) 100%);
  }
  .honeymoon-card-stub-title {
    position: absolute;
    left: 4mm; right: 4mm; bottom: 3mm;
    z-index: 1;
    color: #fff;
    font-size: 9pt;
    line-height: 1.2;
    font-weight: 700;
  }

  .message {
    font-size: 11pt;
    line-height: 1.6;
    white-space: pre-line;
    padding: 4mm 0 6mm;
    border-bottom: 0.2mm solid rgba(44, 24, 16, 0.1);
    min-height: 22mm;
    color: #2c1810;
  }
  .message.empty { color: #b0a59b; font-style: italic; }
  .handwriting-area {
    flex: 1;
    min-height: 50mm;
    margin-top: 4mm;
    background-image: repeating-linear-gradient(
      transparent, transparent 9mm, rgba(44, 24, 16, 0.08) 9mm, rgba(44, 24, 16, 0.08) 9.2mm
    );
  }
  .signoff {
    margin-top: 6mm;
    display: flex;
    flex-direction: column;
    gap: 2mm;
  }
  .from-label {
    font-size: 8pt;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #8a7a6f;
  }
  .signer {
    font-size: 12pt;
    font-weight: 700;
  }
  .signature-space {
    margin-top: 6mm;
    height: 18mm;
    border-bottom: 0.3mm solid rgba(44, 24, 16, 0.25);
  }
</style>
</head>
<body>
  <section class="sheet" aria-label="Outside spread">
    <span class="crop tl-h"></span><span class="crop tl-v"></span>
    <span class="crop tr-h"></span><span class="crop tr-v"></span>
    <span class="crop bl-h"></span><span class="crop bl-v"></span>
    <span class="crop br-h"></span><span class="crop br-v"></span>
    <div class="fold"></div>
    <div class="spread">
      <div class="page page-back">
        <div class="back-text">A wedding gift for you</div>
      </div>
      <div class="page page-front">
        <img id="front-art" class="front-art" alt="">
        <div class="front-caption" id="front-caption">A wedding gift for you…</div>
      </div>
    </div>
  </section>

  <section class="sheet" aria-label="Inside spread">
    <span class="crop tl-h"></span><span class="crop tl-v"></span>
    <span class="crop tr-h"></span><span class="crop tr-v"></span>
    <span class="crop bl-h"></span><span class="crop bl-v"></span>
    <span class="crop br-h"></span><span class="crop br-v"></span>
    <div class="fold"></div>
    <div class="spread">
      <div class="page page-inside-left">
        <div class="type-title" id="type-title">Gift</div>
        <div class="gift-block">
          <div>
            <h2 class="gift-title" id="gift-title"></h2>
            <p class="gift-description" id="gift-description"></p>
          </div>
          <div class="gift-amount" id="gift-amount"></div>
        </div>
        <div class="wish">May this small gift help launch your wonderful new adventure together. With every fondest wish for your journey ahead.</div>
        <div class="honeymoon-attached" id="honeymoon-attached" hidden>
          <div class="honeymoon-attached-label">Honeymoon card attached</div>
          <div class="honeymoon-card-stub" id="honeymoon-card-stub">
            <div class="honeymoon-card-stub-title" id="honeymoon-card-stub-title"></div>
          </div>
        </div>
      </div>
      <div class="page page-inside-right">
        <div>
          <div class="type-title">Your message</div>
          <div class="message" id="message"></div>
          <div class="handwriting-area"></div>
        </div>
        <div class="signoff">
          <div class="from-label">From</div>
          <div class="signer" id="signer"></div>
          <div class="signature-space"></div>
        </div>
      </div>
    </div>
  </section>

  <!--INJECT-DATA-->
  <script>
    (function () {
      var d = window.__DESCRIPTOR__;
      if (!d) { window.__TEMPLATE_READY__ = true; return; }
      var coverUri = d.artefacts && d.artefacts.giftNote && d.artefacts.giftNote.coverImageDataUri;
      var artImg = document.getElementById('front-art');
      if (coverUri) artImg.src = coverUri;
      else artImg.style.visibility = 'hidden';

      var titleEn = d.gift.title && d.gift.title.en || '';
      var descEn = d.gift.description && d.gift.description.en || '';
      document.getElementById('gift-title').textContent = titleEn;
      document.getElementById('gift-description').textContent = descEn;

      var amountEl = document.getElementById('gift-amount');
      if (typeof d.purchase.amount === 'number' && d.purchase.amount > 0) {
        amountEl.textContent = '\u20ac' + d.purchase.amount;
      } else {
        amountEl.hidden = true;
      }

      var typeLabel = 'Gift';
      if (d.gift.type === 'cash') typeLabel = 'Honeymoon card';
      else if (d.gift.type === 'cube') typeLabel = 'Block #' + d.gift.cubeId + ' for our wedding sculpture';
      else if (d.gift.type === 'figurine') typeLabel = 'Figurine';
      document.getElementById('type-title').textContent = typeLabel;

      var msgEl = document.getElementById('message');
      if (d.purchase.message && d.purchase.message.trim()) {
        msgEl.textContent = d.purchase.message;
      } else {
        msgEl.textContent = '(Add a handwritten message on the day if you wish.)';
        msgEl.classList.add('empty');
      }

      document.getElementById('signer').textContent = d.purchase.signerName || d.guest.name || '';

      if (d.gift.type === 'cash' && d.artefacts.honeymoonCard && d.artefacts.honeymoonCard.imageDataUri) {
        var wrap = document.getElementById('honeymoon-attached');
        wrap.hidden = false;
        var stub = document.getElementById('honeymoon-card-stub');
        stub.style.backgroundImage = 'url("' + d.artefacts.honeymoonCard.imageDataUri + '")';
        document.getElementById('honeymoon-card-stub-title').textContent = titleEn;
      }

      window.__TEMPLATE_READY__ = true;
    })();
  </script>
</body>
</html>
