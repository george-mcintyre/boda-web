<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Honeymoon card</title>
<style>
  @page { size: 91mm 61mm; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; color: #2c1810;
    font-family: Georgia, "Times New Roman", serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .card {
    position: relative;
    width: 91mm; height: 61mm;
    padding: 3mm;
    page-break-after: always;
  }
  .card:last-child { page-break-after: auto; }

  .crop { position: absolute; background: #000; }
  .crop.tl-h { top: 0; left: 0; width: 2mm; height: 0.25mm; }
  .crop.tl-v { top: 0; left: 0; width: 0.25mm; height: 2mm; }
  .crop.tr-h { top: 0; right: 0; width: 2mm; height: 0.25mm; }
  .crop.tr-v { top: 0; right: 0; width: 0.25mm; height: 2mm; }
  .crop.bl-h { bottom: 0; left: 0; width: 2mm; height: 0.25mm; }
  .crop.bl-v { bottom: 0; left: 0; width: 0.25mm; height: 2mm; }
  .crop.br-h { bottom: 0; right: 0; width: 2mm; height: 0.25mm; }
  .crop.br-v { bottom: 0; right: 0; width: 0.25mm; height: 2mm; }

  .inner {
    position: relative;
    width: 85mm; height: 55mm;
    overflow: hidden;
    background: #faf6ef;
  }

  .front-art {
    position: absolute; inset: 0;
    background-size: cover;
    background-position: center;
  }
  .front-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.55) 100%);
  }
  .front-copy {
    position: absolute;
    left: 4mm; right: 4mm; bottom: 4mm;
    color: #fff;
    z-index: 1;
  }
  .front-copy h1 {
    margin: 0;
    font-size: 11pt;
    line-height: 1.25;
    font-weight: 700;
  }
  .front-copy .subtitle {
    margin: 1mm 0 0;
    font-size: 7.5pt;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.85;
  }

  .back {
    padding: 4mm 5mm;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 2mm;
  }
  .back h2 {
    margin: 0;
    font-size: 10pt;
    line-height: 1.25;
    font-weight: 700;
    color: #4b3127;
  }
  .back .desc {
    margin: 0;
    font-size: 7.5pt;
    line-height: 1.4;
    color: #5b4337;
    flex: 0 0 auto;
  }
  .back .msg-divider {
    /*
     * Near-invisible hairline divider with a modest gap above and below.
     * The negative top/bottom margins partially cancel the flex `gap: 2mm`
     * on `.back` so the description and message each sit ~1mm from the
     * rule (rather than the full 2mm gap on each side, which wasted
     * ~2mm of vertical space that long messages could claim). Frees ~2mm
     * for an extra line of message text on full cards while still leaving
     * the divider visually separated from the surrounding text.
     */
    margin: -1mm 0;
    height: 0;
    border: 0;
    border-top: 0.1mm solid rgba(44, 24, 16, 0.14);
  }
  .back .msg {
    margin: 0;
    font-size: 8pt;
    /*
     * Line-height generous enough to fully contain Georgia 8pt's natural
     * descenders (p, g, y, j, q, accented characters). 11.2pt — a 1.4 ratio
     * — turned out to be just below the font's natural leading, so glyph
     * descenders on the bottom line poked outside the line-box and got
     * clipped by overflow:hidden, producing the "half a character cut off
     * at the bottom" bug. 12.4pt (≈1.55 ratio) leaves enough room.
     *
     * The JS below clamps max-height to an exact multiple of this value
     * AND subtracts a tiny safety margin (1px) so subpixel rounding in
     * Chromium's PDF rasteriser can't sneak in a partial extra line.
     * Keep the CSS line-height and the JS comment about it in lock-step.
     */
    line-height: 12.4pt;
    color: #2c1810;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    white-space: normal;
    word-wrap: break-word;
  }
  .back .signer {
    margin: 0;
    text-align: right;
    font-size: 8pt;
    color: #5b4337;
    font-weight: 700;
  }
</style>
</head>
<body>
  <section class="card" aria-label="Front">
    <span class="crop tl-h"></span><span class="crop tl-v"></span>
    <span class="crop tr-h"></span><span class="crop tr-v"></span>
    <span class="crop bl-h"></span><span class="crop bl-v"></span>
    <span class="crop br-h"></span><span class="crop br-v"></span>
    <div class="inner">
      <div class="front-art" id="front-art"></div>
      <div class="front-overlay"></div>
      <div class="front-copy">
        <h1 id="front-title"></h1>
        <div class="subtitle" id="front-subtitle"></div>
      </div>
    </div>
  </section>

  <section class="card" aria-label="Back">
    <span class="crop tl-h"></span><span class="crop tl-v"></span>
    <span class="crop tr-h"></span><span class="crop tr-v"></span>
    <span class="crop bl-h"></span><span class="crop bl-v"></span>
    <span class="crop br-h"></span><span class="crop br-v"></span>
    <div class="inner">
      <div class="back">
        <h2 id="back-title"></h2>
        <p class="desc" id="back-description"></p>
        <hr class="msg-divider" aria-hidden="true">
        <p class="msg" id="back-message"></p>
        <p class="signer" id="back-signer"></p>
      </div>
    </div>
  </section>

  <!--INJECT-DATA-->
  <script>
    /*
     * Per-language chrome strings for the printed honeymoon card. Mirrors
     * the STRINGS table in gift-note.html; keep both in sync where keys
     * overlap (currently only the implicit "Honeymoon Card" subtitle).
     */
    var STRINGS = {
      en: { subtitle: 'Honeymoon Card', noMessage: '(No message)' },
      es: { subtitle: 'Tarjeta de luna de miel', noMessage: '(Sin mensaje)' },
      fr: { subtitle: 'Carte lune de miel', noMessage: '(Aucun message)' },
      de: { subtitle: 'Hochzeitsreise-Karte', noMessage: '(Keine Nachricht)' },
    };

    function pickLang(d) {
      var raw = d && d.purchase && d.purchase.lang;
      var lang = (typeof raw === 'string' ? raw : 'en').toLowerCase();
      return STRINGS[lang] ? lang : 'en';
    }

    function localize(obj, lang) {
      if (!obj || typeof obj !== 'object') return '';
      var direct = obj[lang];
      if (direct && String(direct).trim() !== '') return direct;
      if (lang !== 'en' && obj.en && String(obj.en).trim() !== '') return obj.en;
      for (var k in obj) {
        if (Object.prototype.hasOwnProperty.call(obj, k) && obj[k] && String(obj[k]).trim() !== '') return obj[k];
      }
      return '';
    }

    (function () {
      var d = window.__DESCRIPTOR__;
      if (!d) { window.__TEMPLATE_READY__ = true; return; }
      if (d.gift.type !== 'cash') {
        document.body.innerHTML = '<div style="padding:20mm;font-family:sans-serif;">No honeymoon card for non-cash gift.</div>';
        window.__TEMPLATE_READY__ = true;
        return;
      }
      var lang = pickLang(d);
      var S = STRINGS[lang];

      var title = localize(d.gift && d.gift.title, lang);
      var desc = localize(d.gift && d.gift.description, lang);
      var img = (d.artefacts && d.artefacts.honeymoonCard && d.artefacts.honeymoonCard.imageDataUri)
        || d.gift.imageDataUri || '';
      if (img) document.getElementById('front-art').style.backgroundImage = 'url("' + img + '")';
      document.getElementById('front-title').textContent = title;
      document.getElementById('front-subtitle').textContent = S.subtitle;
      document.getElementById('back-title').textContent = title;
      document.getElementById('back-description').textContent = desc;
      var msgRaw = (typeof d.purchase.messageDisplay === 'string' ? d.purchase.messageDisplay : d.purchase.message) || '';
      // Collapse all whitespace (newlines, tabs, runs of spaces) to a
      // single space — the card has no room for line breaks, and many
      // buyers wrote multi-paragraph messages that overflow unless they
      // reflow into a single block.
      var msgFlat = msgRaw.replace(/\s+/g, ' ').trim();
      var msgEl = document.getElementById('back-message');
      msgEl.textContent = msgFlat || S.noMessage;

      // Clamp the message area's height to an exact whole-line multiple.
      //
      // The card geometry is fixed (85x55 mm). Without an exact-line-height
      // clamp the browser still paints a partial extra line when the
      // natural content height isn't a clean multiple of line-height,
      // which gets clipped by overflow:hidden and shows up as "last line
      // cut in half" in the printed PDF.
      //
      // Strategy. The message element has `flex: 1` so the flex pass
      // gives it most of the column's leftover height. But that leftover
      // is generally NOT a whole-line multiple — say, 4.85 × lineHeight.
      // Floor(4.85) = 4 lines would waste the trailing 0.85 line of
      // physical room. Instead we round UP and explicitly set
      // max-height = 5 × lineHeight. The extra 0.15 line is reclaimed
      // from the signer's `margin-top: auto`, which simply absorbs less
      // slack — the signer stays anchored at the bottom of the card.
      //
      // To make the partial-line check unambiguous against subpixel
      // rounding, we test `clientHeight / lineHeightPx` against a small
      // tolerance: if there's any fractional residue (more than 1 line is
      // "almost" full) we promote to the next whole line. Finally we
      // subtract 1px from the resulting max-height so subpixel rounding
      // in Chromium's rasteriser can't paint a partial Nth+1 line past
      // the bottom edge.
      //
      // The CSS line-height must be generous enough to fully contain
      // the font's descenders inside the line-box — see .back .msg above.
      if (msgFlat) {
        var msgStyle = window.getComputedStyle(msgEl);
        var lineHeightPx = parseFloat(msgStyle.lineHeight);
        if (lineHeightPx > 0) {
          var availablePx = msgEl.clientHeight;
          var rawLines = availablePx / lineHeightPx;
          var maxLines = Math.max(1, Math.ceil(rawLines - 0.05));
          msgEl.style.maxHeight = Math.max(1, (maxLines * lineHeightPx) - 1) + 'px';
        }
      }

      if (msgFlat && msgEl.scrollHeight > msgEl.clientHeight) {
        var lo = 0;
        var hi = msgFlat.length;
        var ellipsis = '\u2026';
        // Trim back to a word boundary so we don't cut a word in half.
        var trimToWord = function (s) {
          var i = s.length;
          while (i > 0 && !/\s/.test(s[i - 1])) i--;
          return (i > 0 ? s.slice(0, i) : s).replace(/[\s.,;:!?\-\u2013\u2014]+$/, '');
        };
        // Binary search for the largest prefix whose rendered height fits.
        while (lo < hi) {
          var mid = Math.ceil((lo + hi) / 2);
          msgEl.textContent = msgFlat.slice(0, mid) + ellipsis;
          if (msgEl.scrollHeight > msgEl.clientHeight) hi = mid - 1;
          else lo = mid;
        }
        msgEl.textContent = trimToWord(msgFlat.slice(0, lo)) + ellipsis;
      }

      document.getElementById('back-signer').textContent = '\u2014 ' + (d.purchase.signerName || d.guest.name || '');
      window.__TEMPLATE_READY__ = true;
    })();
  </script>
</body>
</html>
