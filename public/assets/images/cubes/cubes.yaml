# Cube tapestry data for individual cube rendering.
#
# Each cube is rendered alone (e.g. on a gift registry page).
# All 6 faces are recorded since all are visible in solo render.
#
# Face values:
#   - Image id "{prefix}-{row}-{col}" → /assets/images/cubes/{id}.jpg
#       prefix: h (Heart, front wall)
#               i (Iluminada, left wall)
#               g (George, right wall)
#               b (Bora Bora, top wall)
#   - "white"  → blank/white face
#   - "mirror" → mirrored face (forms inner walls of the heart enclave)
#
# Cubes are numbered 1..38 in heart-wall reading order first (1-16),
# then Ilu-wall only (17-26), then George-wall only (27-36),
# then Bora-wall only (37-38).

# NOTE: Each cube has been re-oriented for display purposes so that
# at least one image face is on `front`. Original physical orientations
# from the printed sculpture are not preserved here. The viewer always
# treats `front` as the face-on view.
#
# `position` records where the cube sits in the assembled sculpture, using
# the same (col, row, level) grid as scripts/generate_full_assembly_stl.py:
#   col   0..3  left → right when looking at the heart wall from the front
#   row   0..3  0 = front (heart wall), 3 = back
#   level 1..4  1 = on the base disk, 4 = top
# This is used by the admin UI to tell physical block locations apart.

cubes:
  # --- Heart wall (cubes 1-16) ---
  - id: 1
    front: h-1-1
    back: white
    top: b-3-1
    bottom: white
    left: i-1-3
    right: white
    position:
      col: 0
      row: 1
      level: 4
