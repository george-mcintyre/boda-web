<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="guests:title">Guests Zone - Iluminada & George</title>
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/wedding.css">
  <link rel="stylesheet" href="assets/css/guests.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <!-- Leaflet CSS for maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <!-- Leaflet JS for maps -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
<!-- Sticky Navbar -->
<nav class="navbar">
  <div class="container">
    <div class="header-left">
      <h1 data-i18n="guests:welcome.title"><i class="fas fa-user"></i> Guests Zone</h1>
      <span id="guestNameDisplay" class="guest-name-display" style="display: none;"></span>
    </div>
    <div class="header-actions" aria-label="Top-right actions">
      <!-- Language Selector Component -->
      <div data-auto-init="language-selector" class="language-selector"></div>
      <a href="index.html" class="home-link">
        <i class="fas fa-home" aria-hidden="true"></i>
        <span data-i18n="common:home">Home</span>
      </a>
      <button onclick="logoutGuest()" class="logout-btn">
        <i class="fas fa-sign-out-alt"></i>
        <span data-i18n="guests:logout">Logout</span>
    </div>
  </div>
</nav>
<!-- <section class="guest-zone"></section> -->

<main class="with-background">
  <div class="tabs-container-full">
    <div class="tabs-header">
      <button class="tab-btn active" data-tab="summary">
        <i class="fas fa-chart-bar"></i>
        <span data-i18n="guests:summary">Summary</span>
      </button>
      <button class="tab-btn" data-tab="party">
        <i class="fas fa-users"></i>
        <span data-i18n="guests:party">Party</span>
      </button>
      <button class="tab-btn" data-tab="events">
        <i class="fas fa-calendar-alt"></i>
        <span data-i18n="guests:rsvp">RSVP</span>
      </button>
      <button class="tab-btn" data-tab="menu">
        <i class="fas fa-utensils"></i>
        <span data-i18n="guests:menu">Menu</span>
      </button>
      <button class="tab-btn" data-tab="gifts">
        <i class="fas fa-money-bill-wave"></i>
        <span data-i18n="guests:gifts">Gifts</span>
      </button>
    </div>

    <!-- Content of the Summary tab -->
    <div id="summary-tab" class="tab-content active">
      <section id="summaryPage">
        <div class="intro-card intro-section">
          <h2 class="card-title">
            <div data-i18n="guests:summaryPageTitle"></div>
          </h2>
          <p class="card-description">
          <div data-i18n="guests:summaryPageDescription:rich"></div>
          </p>
        </div>
      </section>

      <div class="summary-grid">
        <!-- Summary Section (Left) - dynamically loaded -->
        <section id="summary" class="summary-card summary-left-panel">
          <h2><i class="fas fa-clipboard-list"></i> <span data-i18n="guests:yourSummary">Your Summary</span></h2>
          <div class="loading-summary">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <p data-i18n="guests:loadingSummary">Loading summary...</p>
          </div>
        </section>

        <!-- Comments Card Section (Right) -->
        <section class="summary-card comments-card">
          <div class="comments-header">
            <h2><i class="fas fa-comments"></i> <span data-i18n="guests:commentsTitle">Comments</span></h2>
            <p class="comments-subtitle" data-i18n="guests:commentsSubtitle:rich">Share your thoughts with other
              guests</p>
          </div>

          <!-- New comment form -->
          <div class="new-comment-form">
            <form id="commentForm">
              <div class="comment-input-container" data-i18n="guests:commentPlaceholder:rich">
                  <textarea
                      id="newComment"
                      name="comment"
                      placeholder="Write your comment..."
                      rows="3"
                      maxlength="500"
                  ></textarea>
              </div>
              <div class="comment-actions">
                <div class="char-count-container">
                  <span class="char-count">0/500</span>
                </div>
                <div class="comment-posting-as">
                  <select id="postingAsSelect" class="posting-as-dropdown">
                    <option data-i18n="guests:loadingPartyMembers">Loading party members...</option>
                  </select>
                </div>
                <button type="submit" class="comment-submit-btn">
                  <i class="fas fa-paper-plane"></i>
                  <span data-i18n="guests:postComment">Post</span>
                </button>
              </div>
            </form>
          </div>

          <!-- Comments list -->
          <div class="comments-list" id="commentsList">
            <!-- Comments will be loaded dynamically here -->
            <div class="loading-comments">
              <i class="fas fa-spinner fa-spin"></i>
              <span data-i18n="guests:loadingComments">Loading comments...</span>
            </div>
          </div>
        </section>
      </div>
    </div>

    <!-- Content of the Party tab -->
    <div id="party-tab" class="tab-content">
      <section id="party-section">
        <div id="party"></div>
      </section>
    </div>

    <!-- Content of the Menu tab -->
    <div id="menu-tab" class="tab-content">
      <section id="menu-section">
        <div id="menu"></div>
      </section>
    </div>

    <!-- Content of the Gifts tab -->
    <div id="gifts-tab" class="tab-content">
      <section id="gifts-section">
        <div id="gifts"></div>
      </section>
    </div>

    <!-- Content of the RSVP tab -->
    <div id="events-tab" class="tab-content">
      <section id="events-section">
        <div id="events"></div>
      </section>
    </div>
  </div>
</main>

<footer>
  <div class="footer-content">
    <p data-i18n="wedding.rich:common:footer026:rich Boda de Iluminada &amp; George</p>
  </div>
</footer>

<script src="https://js.stripe.com/v3/"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="js/summary/summary.js"></script>
<script src="js/summary/comments.js"></script>
<script src="js/guests/guests.js"></script>
<script src="js/events/events.js"></script>
<script src="js/menu/menu.js"></script>
<script src="js/gifts/gifts.js"></script>
<script src="js/guests.js"></script>
<script src="components/language-selector.js"></script>
</body>
</html>
