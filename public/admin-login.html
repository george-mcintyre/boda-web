<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="adminLogin:pageTitle">Acceso Administrador - Boda de Iluminada & George</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/wedding.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <main>
        <div class="admin-login-container fade-in-up">
            <div class="admin-login-icon">
                <i class="fas fa-cog"></i>
            </div>
            <h2 data-i18n="adminLogin:subHeader">Administrator Login</h2>
            <p class="admin-login-description" data-i18n="adminLogin:description">
                Enter your credentials to manage the wedding details and attendance confirmations.
            </p>

            <form id="adminLoginForm" class="admin-login-form">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user-shield"></i> <span data-i18n="adminLogin:username">Usuario</span></label>
                    <input type="text" id="username" name="username" data-i18n-placeholder="adminLogin:usernamePlaceholder" placeholder="Tu name de usuario" required>
                </div>
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> <span data-i18n="adminLogin:password">Contraseña</span></label>
                    <div class="password-input-container">
                        <input type="password" id="password" name="password" data-i18n-placeholder="adminLogin:passwordPlaceholder" placeholder="Tu contraseña secreta" required>
                        <button type="button" class="password-toggle" id="togglePassword">
                            <i class="fas fa-eye-slash"></i>
                        </button>
                    </div>
                </div>
                <a href="index.html" class="home-link">
                    <i class="fas fa-home" aria-hidden="true"></i>
                    <span data-i18n="common:home">Cancel</span>
                </a>
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> <span data-i18n="adminLogin:submit">Login</span>
                </button>
            </form>

            <div class="admin-login-footer">
                <p>
                    <i class="fas fa-heart"></i> Boda de Iluminada & George
                </p>
            </div>
        </div>
    </main>
    
    <!-- i18n common system -->
    <script src="/js/i18n.js"></script>
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');

        togglePassword.addEventListener('click', function (e) {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });
    </script>
    <script src="/js/auth-check.js"></script>
    <script src="js/admin-login.js"></script>
    <script>
        // Additional check for admin login page - redirect if already logged in
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof isAdminLoggedIn === 'function' && isAdminLoggedIn()) {
                window.location.href = '/admin.html';
            }
            updateDocumentDirection();
            updatePageContent();
            updateLanguageSelector();
            updateFormatting();
        });
    </script>
</body>
</html>
