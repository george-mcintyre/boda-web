<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="login:pageTitle">Guest access - Wedding</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <header>
    <div class="header-content">
      <h1 data-i18n="login:header">Guest access</h1>
      <a href="index.html" class="home-link">
        <i class="fas fa-home"></i>
        <span data-i18n="login:home">Home</span>
      </a>
    </div>
  </header>
  <main>
    <form id="loginForm" autocomplete="off">
      <label for="email" data-i18n="login:emailLabel">Email:</label>
      <input type="email" id="email" name="email" autocomplete="off" data-i18n-placeholder="login:emailPlaceholder" placeholder="Enter your email" required>
      <button type="submit" data-i18n="login:submit">Continue</button>
    </form>
    <div id="loginMessage" style="margin-top:1em;"></div>
  </main>
  <script src="js/i18n.js"></script>
  <script src="js/auth-check.js"></script>
  <script src="js/login.js"></script>
  <script>
      // Additional check for login page - redirect if already logged in as guest
      document.addEventListener('DOMContentLoaded', function() {
          if (typeof isGuestLoggedIn === 'function' && isGuestLoggedIn()) {
              console.log('Guest already logged in, redirecting to dashboard');
              window.location.href = 'guests.html';
          }
      });
  </script>
</body>
</html>
