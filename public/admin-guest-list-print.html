<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest List - Wedding of Iluminada & George</title>
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="/js/i18n.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; color: #2C1810; background: #fff; padding: 20px; }
    h1 { font-family: 'Playfair Display', serif; font-size: 18px; color: #8B5A96; margin-bottom: 4px; }
    .subtitle { font-size: 11px; color: #6B4E3D; margin-bottom: 12px; }
    .print-btn { background: #8B5A96; color: #fff; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-bottom: 16px; }
    .print-btn:hover { background: #7a4d85; }

    table { width: 100%; border-collapse: collapse; font-size: 10px; }
    thead th {
      background: #f3eff5; color: #8B5A96; font-weight: 600; padding: 6px 4px;
      border-bottom: 2px solid #d4b8dd; text-align: center; white-space: nowrap;
    }
    thead th:first-child { text-align: left; }
    thead th i { font-size: 12px; }
    thead th .th-label { display: block; font-size: 8px; font-weight: 400; color: #6B4E3D; margin-top: 1px; }

    tbody td { padding: 4px; border-bottom: 1px solid #eee; vertical-align: top; text-align: center; }
    tbody td:first-child { text-align: left; font-weight: 500; }
    tbody td:nth-child(2) { text-align: left; color: #999; font-size: 9px; }
    tbody td:nth-child(3) { text-align: left; font-size: 9px; color: #666; }

    tfoot td { padding: 6px 4px; border-top: 2px solid #d4b8dd; text-align: center; font-weight: 700; font-size: 10px; color: #8B5A96; background: #f9f5fb; }
    tfoot td:first-child { text-align: left; }

    tr.party-first td { border-top: 2px solid #e8dced; }
    tr.principal td:first-child { font-weight: 600; }
    tr.member td:first-child { padding-left: 12px; font-weight: 400; color: #555; }

    .check { color: #28a745; }
    .xmark { color: #dc3545; }
    .allergy-badges { display: flex; flex-wrap: wrap; gap: 2px; justify-content: flex-start; }
    .allergy-badge {
      display: inline-block; background: #fff3cd; color: #856404; border-radius: 3px;
      padding: 1px 4px; font-size: 8px; font-weight: 500; white-space: nowrap;
    }
    .allergy-detail { font-size: 8px; color: #666; margin-top: 2px; font-style: italic; }

    .summary { display: flex; gap: 20px; margin-bottom: 12px; font-size: 11px; color: #6B4E3D; }
    .summary span { font-weight: 600; color: #8B5A96; }

    @media print {
      .print-btn, .no-print { display: none !important; }
      body { padding: 0; font-size: 9px; }
      table { font-size: 8px; }
      thead th { font-size: 9px; }
      thead th .th-label { font-size: 7px; }
      @page { size: landscape; margin: 10mm; }
    }
  </style>
</head>
<body>
  <button class="print-btn no-print" onclick="window.print()"><i class="fas fa-print"></i> <span id="printLabel"></span></button>
  <h1><i class="fas fa-heart" style="color:#D4A5A5;"></i> Iluminada & George - <span id="pageTitle"></span></h1>
  <div class="subtitle" id="generated"></div>
  <div class="summary" id="summary"></div>
  <div id="error" style="display:none;color:#dc3545;padding:20px;"></div>
  <table>
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
    <tfoot id="tfoot"></tfoot>
  </table>

  <script>
    // Apply i18n to static elements
    document.getElementById('printLabel').textContent = translate('admin:guestPrint.print');
    document.getElementById('pageTitle').textContent = translate('admin:guestPrint.title');
    document.title = translate('admin:guestPrint.title');
    document.getElementById('thead').innerHTML = `<tr>
      <th style="min-width:140px;"><i class="fas fa-user"></i><span class="th-label">${translate('admin:guestPrint.name')}</span></th>
      <th><i class="fas fa-users"></i><span class="th-label">${translate('admin:guestPrint.party')}</span></th>
      <th><i class="fas fa-envelope"></i><span class="th-label">${translate('admin:guestPrint.email')}</span></th>
      <th><i class="fas fa-child"></i><span class="th-label">${translate('admin:guestPrint.child')}</span></th>
      <th><i class="fas fa-glass-cheers"></i><span class="th-label">${translate('admin:guestPrint.pre')}</span></th>
      <th><i class="fas fa-heart"></i><span class="th-label">${translate('admin:guestPrint.day')}</span></th>
      <th><i class="fas fa-sun"></i><span class="th-label">${translate('admin:guestPrint.post')}</span></th>
      <th><i class="fas fa-calendar-check"></i><span class="th-label">${translate('admin:guestPrint.rsvp')}</span></th>
      <th><i class="fas fa-user-secret"></i><span class="th-label">${translate('admin:guestPrint.unnamed')}</span></th>
      <th><i class="fas fa-utensils"></i><span class="th-label">${translate('admin:guestPrint.menu')}</span></th>
      <th style="min-width:120px;text-align:left;"><i class="fas fa-exclamation-triangle"></i><span class="th-label">${translate('admin:guestPrint.allergy')}</span></th>
    </tr>`;

    const token = localStorage.getItem('adminToken') || '';
    if (!token) {
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = 'Not authenticated. Please log in as admin first.';
    } else {
      load();
    }

    async function load() {
      try {
        const res = await fetch('/api/admin/guest-list-print', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!res.ok) throw new Error('API error: ' + res.status);
        const data = await res.json();
        render(data);
      } catch (e) {
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = 'Failed to load: ' + e.message;
      }
    }

    function render(data) {
      const { rows } = data;
      const dateStr = new Date().toLocaleDateString(currentLanguage, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      document.getElementById('generated').textContent = translate('admin:guestPrint.generated') + ': ' + dateStr;

      const totalPeople = rows.length;
      const totalParties = new Set(rows.map(r => r.principalName)).size;
      const totalChildren = rows.filter(r => r.isChild).length;
      const totalRsvp = rows.filter(r => r.hasRsvp).length;
      document.getElementById('summary').innerHTML =
        `<div>${translateWithVars('admin:guestPrint.totalPeople', { count: `<span>${totalPeople}</span>`, parties: `<span>${totalParties}</span>` })}</div>` +
        `<div>${translateWithVars('admin:guestPrint.children', { count: `<span>${totalChildren}</span>` })}</div>` +
        `<div>${translateWithVars('admin:guestPrint.rsvpd', { count: `<span>${totalRsvp}</span>` })}</div>`;

      const tbody = document.getElementById('tbody');
      let lastPrincipal = '';

      rows.forEach(r => {
        const tr = document.createElement('tr');
        const isNewParty = r.principalName !== lastPrincipal;
        if (isNewParty) tr.classList.add('party-first');
        tr.classList.add(r.isPrincipal ? 'principal' : 'member');
        lastPrincipal = r.principalName;

        const ck = '<i class="fas fa-check check"></i>';
        const xm = '<i class="fas fa-times xmark"></i>';
        const empty = '';

        let allergyHtml = '';
        if (r.allergies.badges.length > 0 || r.allergies.detail) {
          const badgeLabels = {
            'vegetarian': translate('admin:dietary.vegetarian'),
            'lactose-intolerant': translate('admin:dietary.lactoseIntolerant'),
            'gluten-intolerant': translate('admin:dietary.glutenIntolerant'),
            'nut-allergy': translate('admin:dietary.nutAllergy'),
            'other': translate('admin:dietary.other')
          };
          allergyHtml = '<div class="allergy-badges">' +
            r.allergies.badges.map(b => `<span class="allergy-badge">${badgeLabels[b] || b}</span>`).join('') +
            '</div>';
          if (r.allergies.detail) allergyHtml += `<div class="allergy-detail">${r.allergies.detail}</div>`;
        }

        tr.innerHTML =
          `<td>${r.name}</td>` +
          `<td>${r.isPrincipal ? '' : r.principalName}</td>` +
          `<td>${r.email}</td>` +
          `<td>${r.isChild ? ck : empty}</td>` +
          `<td>${r.attendance[0] ? ck : empty}</td>` +
          `<td>${r.attendance[1] ? ck : empty}</td>` +
          `<td>${r.attendance[2] ? ck : empty}</td>` +
          `<td>${r.hasRsvp ? ck : empty}</td>` +
          `<td>${r.isUnnamed ? xm : empty}</td>` +
          `<td>${r.hasMenu ? ck : empty}</td>` +
          `<td style="text-align:left;">${allergyHtml}</td>`;

        tbody.appendChild(tr);
      });

      const totals = {
        parties: totalParties,
        children: totalChildren,
        pre: rows.filter(r => r.attendance[0]).length,
        day: rows.filter(r => r.attendance[1]).length,
        post: rows.filter(r => r.attendance[2]).length,
        rsvp: totalRsvp,
        unnamed: rows.filter(r => r.isUnnamed).length,
        menu: rows.filter(r => r.hasMenu).length
      };

      document.getElementById('tfoot').innerHTML =
        `<tr>` +
        `<td>${totalPeople}</td>` +
        `<td>${totals.parties}</td>` +
        `<td></td>` +
        `<td>${totals.children}</td>` +
        `<td>${totals.pre}</td>` +
        `<td>${totals.day}</td>` +
        `<td>${totals.post}</td>` +
        `<td>${totals.rsvp}</td>` +
        `<td>${totals.unnamed}</td>` +
        `<td>${totals.menu}</td>` +
        `<td></td>` +
        `</tr>`;
    }
  </script>
</body>
</html>
